[package]
authors = ["James Lalonde"]
categories = ["development-tools", "web-programming"]
description = "Generate strongly-typed Rust structs, HTTP clients, and SSE streaming clients from OpenAPI 3.1 specifications"
edition = "2024"
homepage = "https://github.com/gpu-cli/openapi-to-rust"
keywords = ["api-client", "codegen", "openapi", "rust", "server-handler", "sse"]
license = "MIT"
name = "openapi-to-rust"
readme = "README.md"
repository = "https://github.com/gpu-cli/openapi-to-rust"
rust-version = "1.85.0"
version = "0.1.2"

[dependencies]
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
insta = { version = "1.41", features = ["yaml"] }
once_cell = "1.19"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json", "stream"] }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
specta = { version = "2.0.0-rc", features = ["derive"], optional = true }
syn = { version = "2.0", features = ["parsing"] }
tempfile = "3.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", optional = true }
url = "2.5"
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
insta = { version = "1.41", features = ["yaml"] }
serde_yaml = "0.9"

[features]
axum-handlers = ["dep:async-trait", "dep:axum", "dep:tower"]
specta = ["dep:specta"]

[[bin]]
name = "openapi-to-rust"
path = "src/bin/openapi-to-rust.rs"

[lints.clippy]
expect_used = "warn"
unwrap_used = "deny"
